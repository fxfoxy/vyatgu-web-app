server {
    listen 80;
    server_name _;

    # Наружу торчит только public/ — исходники src/, composer.json и vendor/ недоступны
    root /var/www/html/public;
    # index нужен только для каталогов (например /dist/): отдаём index.html
    index index.html index.php;

    # Согласовано с upload_max_filesize/post_max_size в php.ini
    client_max_body_size 20m;

    # Health-эндпоинт для healthcheck контейнера: просто 200, без записи в access_log
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Корень сайта — SPA-оболочка из сборки фронтенда (app/public/dist/).
    # Пришлось выделить в отдельную location: "/" — это каталог, и через
    # общий try_files nginx ушёл бы в index.php (PHP-роутер), а не в SPA.
    location = / {
        try_files /dist/index.html =404;
    }

    # Бэкенд: всё под /api/ уходит в PHP-роутер (feature/controller/action)
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Фронтенд: существующие файлы (dist/assets/* и т.п.) отдаём как есть,
    # остальные пути — SPA-оболочка из сборки.
    # Благодаря этому работают клиентские маршруты /login, /register и F5 на них.
    location / {
        try_files $uri /dist/index.html;
    }

    location ~ \.php$ {
        # Не передавать в php-fpm несуществующие скрипты (защита от подстановки PATH_INFO)
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.п.), если они вдруг окажутся в public/
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
