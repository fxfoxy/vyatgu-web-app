; Дев-режим: ошибки сразу видны в браузере, а не только в логах
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
expose_php = Off

; Лимиты загрузки — согласованы с client_max_body_size в nginx (20m)
upload_max_filesize = 20M
post_max_size = 20M

; Без явной таймзоны PHP на каждый вызов date()/DateTime сыпет warning
date.timezone = Europe/Moscow

; OpCache в дев-режиме: проверяем mtime файла на каждый запрос,
; чтобы правки в коде были видны сразу, без сброса кеша и рестарта
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Настройки работы с сессиями: имя сессионной куки нашего приложения,
; отключаем сессионный GC, т.к. делаем свой по крону
; кука/авторизация живёт 7 дней
session.name = TreLoLo
session.gc_probability = 0
session.cookie_lifetime = 604800
